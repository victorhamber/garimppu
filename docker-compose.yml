# Same shape as the EasyPanel deploy (see DEPLOY.md): Postgres, the API with a media volume, and the panel.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: garimppu
      POSTGRES_PASSWORD: garimppu
      POSTGRES_DB: garimppu
    volumes:
      - garimppu-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garimppu"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgres://garimppu:garimppu@db:5432/garimppu
      APP_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:8000
    volumes:
      - garimppu-media:/app/data
    ports:
      - "8000:8000"
    shm_size: "1gb"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  garimppu-db:
  garimppu-media:
