<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Garimppu</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><span class="logo" aria-hidden="true">G</span>Garimppu</header>

  <form id="connect" hidden>
    <div class="field">
      <label for="email">Seu e-mail</label>
      <input id="email" type="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="password">Senha do Garimppu <span class="muted">(assinantes)</span></label>
      <input id="password" type="password" autocomplete="current-password" aria-describedby="password-hint">
      <p id="password-hint" class="hint">Sem senha: filtros e downloads grátis. Com senha: os anúncios e favoritos vão para o app.</p>
    </div>
    <p id="error" class="error" role="alert" hidden></p>
    <button class="btn primary" type="submit">Começar</button>
  </form>

  <section id="connected" hidden>
    <div class="account">
      <p><strong id="who"></strong></p>
      <p id="plan" class="hint"></p>
      <a id="upgrade" class="upgrade" target="_blank" rel="noopener" hidden>Assinar o Garimppu</a>
    </div>

    <form id="filters">
      <h2>Filtros</h2>
      <div class="row">
        <label for="minDays">Dias no ar, no mínimo</label>
        <input id="minDays" type="number" min="0" max="3650" inputmode="numeric" placeholder="0">
      </div>
      <div class="row">
        <label for="minSameCreative">Anúncios com o mesmo criativo</label>
        <input id="minSameCreative" type="number" min="0" max="999" inputmode="numeric" placeholder="0">
      </div>
      <div class="row">
        <label for="minPageAds">Anúncios do anunciante na busca</label>
        <input id="minPageAds" type="number" min="0" max="999" inputmode="numeric" placeholder="0">
      </div>
      <label class="check"><input id="withLink" type="checkbox"> Só anúncios com link de venda</label>
      <label class="check"><input id="dim" type="checkbox"> Apagar na página os que não passam</label>
      <p id="saved" class="hint" role="status"></p>
    </form>

    <a class="btn primary" href="https://www.facebook.com/ads/library/?active_status=active&amp;ad_type=all&amp;country=BR&amp;media_type=all"
      target="_blank" rel="noopener">Abrir a Biblioteca de Anúncios</a>
    <button id="disconnect" class="link" type="button">Sair</button>
  </section>

  <script src="filters.js"></script>
  <script src="popup.js"></script>
</body>
</html>
